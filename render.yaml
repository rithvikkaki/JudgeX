# =========================================================================
#  Render Blueprint - https://render.com/docs/blueprint-spec
#
#  Two services:
#    1. online-coding-judge  - the FastAPI API, on the native Python runtime
#    2. crucible-web         - the React frontend, as a static site
#
#  The API is deployed WITHOUT Docker. Render's free tier exposes no Docker
#  socket, so the container sandbox could never run there; building an image
#  only added a slow, fragile build for no isolation benefit. The Docker
#  sandbox is still the real one - `docker compose up` locally uses it.
#
#  DATABASE_URL is deliberately NOT defined here: set it in the Render
#  dashboard so the credential never lands in version control.
# =========================================================================

services:
  # ---------------------------------------------------------------- API --
  - type: web
    name: judgex-api
    runtime: docker
    plan: free
    region: oregon
    branch: main

    healthCheckPath: /api/v1/ping

    envVars:
      # ---- Set manually in the dashboard (marked sync:false) -------------
      - key: DATABASE_URL
        sync: false          # paste your Neon pooled connection string here
      - key: ADMIN_EMAILS
        sync: false          # the email you register with, to get admin

      # ---- Generated once by Render and then held stable -----------------
      - key: SECRET_KEY
        generateValue: true

      # ---- Runtime -------------------------------------------------------
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: AUTO_SEED
        value: "true"
      - key: IN_PROCESS_WORKER
        value: "true"
      # Comma-separated list of allowed origins.
      - key: CORS_ORIGINS
        sync: false          # e.g. https://judgex-web.onrender.com

      # ---- Execution engine ----------------------------------------------
      # Inside the isolated Linux container, LocalBackend enforces POSIX rlimits
      # (RLIMIT_AS, RLIMIT_CPU, RLIMIT_NPROC, RLIMIT_FSIZE) for Python/C++/Java.
      - key: EXECUTION_BACKEND
        value: local
      - key: ALLOW_UNSAFE_LOCAL_EXECUTION
        value: "true"
      - key: EXECUTION_TIME_LIMIT_MS
        value: "2000"
      - key: EXECUTION_MEMORY_LIMIT_MB
        value: "128"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

  # ----------------------------------------------------------- Frontend --
  - type: web
    name: judgex-web
    runtime: static
    # No `plan` key: Render static sites are always free and reject it.
    branch: main
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Vite inlines VITE_* variables at build time, so changing this requires
      # a rebuild, not just a restart.
      - key: VITE_API_BASE_URL
        sync: false          # e.g. https://online-coding-judge-7w5q.onrender.com

    routes:
      # Single-page app: every unmatched path must return index.html so that
      # deep links like /problems/two-sum work on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite emits content-hashed filenames, so assets can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
