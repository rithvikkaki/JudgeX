name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest

    env:
      # SQLite plus the local sandbox keeps CI free of external services.
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      EXECUTION_BACKEND: local
      ADMIN_EMAILS: admin@example.com
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Verify the seed data is self-consistent
        run: |
          python -m scripts.seed --reset
          python scripts/verify_seed.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t online-coding-judge:ci .
      - name: Container starts and answers its health check
        run: |
          docker run -d --name judge \
            -e DATABASE_URL=sqlite:///./ci.db \
            -e SECRET_KEY=ci-secret \
            -e EXECUTION_BACKEND=local \
            -p 8000:8000 online-coding-judge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/ping; then exit 0; fi
            sleep 2
          done
          echo "Service did not become healthy"; docker logs judge; exit 1
